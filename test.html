<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Material Web (Self Hosted)</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Import Map -->
<script type="importmap">
{
  "imports": {
    "tslib": "https://apicenter.pages.dev/libraries/wledig/tslib/tslib.es6.js",

    "lit": "https://apicenter.pages.dev/libraries/wledig/lit/index.js",
    "lit/": "https://apicenter.pages.dev/libraries/wledig/lit/",

    "lit-html": "https://apicenter.pages.dev/libraries/wledig/lit-html/lit-html.js",
    "lit-html/": "https://apicenter.pages.dev/libraries/wledig/lit-html/",

    "lit-element": "https://apicenter.pages.dev/libraries/wledig/lit-element/lit-element.js",
    "lit-element/": "https://apicenter.pages.dev/libraries/wledig/lit-element/",

    "@lit/reactive-element": "https://apicenter.pages.dev/libraries/wledig/reactive-element/reactive-element.js",
    "@lit/reactive-element/": "https://apicenter.pages.dev/libraries/wledig/reactive-element/",

    "@material/web/": "https://apicenter.pages.dev/libraries/wledig/@material/web/"
  }
}
</script>

</head>

<body>

    <h1>My Material Web Site</h1>

    <md-filled-text-field
        id="name"
        label="Your Name">
    </md-filled-text-field>

    <br><br>

    <md-filled-button id="btn">
        Click Me
    </md-filled-button>


    <!-- Load Material Web Components -->
    <script type="module">
        import '@material/web/textfield/filled-text-field.js';
        import '@material/web/button/filled-button.js';

        // Optional: Button test
        const btn = document.getElementById('btn');

        btn.addEventListener('click', () => {
            alert('Material Web Loaded!');
        });
    </script>

    <!-- Your Main Script -->
    <script type="module" src="./main.js"></script>

</body>
</html>

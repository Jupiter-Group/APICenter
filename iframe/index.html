<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom iFrame Embedder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Custom Website Embedder</h1>
        <div class="iframe-container">
            <iframe id="custom-iframe" src="" frameborder="0"></iframe>
        </div>

        <div class="input-container">
            <input type="text" id="url-input" placeholder="Enter website URL">
            <button id="load-url">Load Website</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
